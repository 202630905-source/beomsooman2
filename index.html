<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상점 SOS! 학교 상점 달성 플래너</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
        }
        /* 게이지 애니메이션 효과 */
        .progress-bar-fill {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Header Section -->
    <header class="gradient-bg text-white shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-8">
            <div class="flex items-center space-x-3 mb-2">
                <span class="bg-amber-400 text-slate-900 font-black px-3 py-1 rounded-full text-xs tracking-wider uppercase">
                    MERIT PLANNER
                </span>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">상점 획득 추천 플래너</h1>
            </div>
            <p class="text-blue-100 text-sm sm:text-base">
                오늘의 시간표, 목표 상점, 교무실 거리를 분석하여 할 일을 추천해 드립니다. 미션을 완수하고 체크하여 게이지를 채워보세요!
            </p>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-8 w-full flex-grow">
        
        <!-- Input Form Section -->
        <section class="bg-white rounded-2xl shadow-xl p-6 mb-8 border border-slate-100">
            <h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center border-b pb-3 border-slate-100">
                <i class="fa-solid fa-sliders text-blue-600 mr-2.5"></i>
                정보 및 시간표 입력
            </h2>

            <form id="plannerForm" class="space-y-6" onsubmit="event.preventDefault(); generatePlan();">
                
                <!-- Target Merit & Location Inputs -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- Target Merit -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">
                            <i class="fa-solid fa-bullseye text-red-500 mr-1"></i> 목표 상점 (점)
                        </label>
                        <input type="number" id="targetMerit" min="1" max="50" value="10" required
                            class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 font-bold text-slate-800">
                    </div>

                    <!-- Class Location -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">
                            <i class="fa-solid fa-door-open text-amber-500 mr-1"></i> 내 교실 위치
                        </label>
                        <select id="classFloor" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 font-medium">
                            <option value="1">1층</option>
                            <option value="2">2층</option>
                            <option value="3" selected>3층</option>
                            <option value="4">4층</option>
                            <option value="5">5층</option>
                        </select>
                    </div>

                    <!-- Office Location -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">
                            <i class="fa-solid fa-building text-indigo-500 mr-1"></i> 교무실/학생부 위치
                        </label>
                        <select id="officeFloor" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 font-medium">
                            <option value="1" selected>1층</option>
                            <option value="2">2층</option>
                            <option value="3">3층</option>
                            <option value="4">4층</option>
                            <option value="5">5층</option>
                        </select>
                    </div>
                </div>

                <!-- Timetable Inputs -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-3 flex items-center justify-between">
                        <span><i class="fa-regular fa-clock text-blue-500 mr-1"></i> 오늘 교시별 시간표 입력</span>
                        <span class="text-xs font-normal text-slate-500">과목명을 입력하세요 (예: 체육, 과학, 영어)</span>
                    </label>

                    <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-2.5">
                        <div>
                            <span class="block text-xs text-slate-500 text-center mb-1 font-medium">1교시</span>
                            <input type="text" id="p1" placeholder="국어" value="국어" required class="w-full text-center py-2 px-2 border border-slate-300 rounded-md text-sm focus:ring-1 focus:ring-blue-500">
                        </div>
                        <div>
                            <span class="block text-xs text-slate-500 text-center mb-1 font-medium">2교시</span>
                            <input type="text" id="p2" placeholder="수학" value="수학" required class="w-full text-center py-2 px-2 border border-slate-300 rounded-md text-sm focus:ring-1 focus:ring-blue-500">
                        </div>
                        <div>
                            <span class="block text-xs text-slate-500 text-center mb-1 font-medium">3교시</span>
                            <input type="text" id="p3" placeholder="체육" value="체육" required class="w-full text-center py-2 px-2 border border-slate-300 rounded-md text-sm focus:ring-1 focus:ring-blue-500">
                        </div>
                        <div>
                            <span class="block text-xs text-slate-500 text-center mb-1 font-medium">4교시</span>
                            <input type="text" id="p4" placeholder="영어" value="영어" required class="w-full text-center py-2 px-2 border border-slate-300 rounded-md text-sm focus:ring-1 focus:ring-blue-500">
                        </div>
                        <div>
                            <span class="block text-xs text-slate-500 text-center mb-1 font-medium">5교시</span>
                            <input type="text" id="p5" placeholder="과학" value="과학" required class="w-full text-center py-2 px-2 border border-slate-300 rounded-md text-sm focus:ring-1 focus:ring-blue-500">
                        </div>
                        <div>
                            <span class="block text-xs text-slate-500 text-center mb-1 font-medium">6교시</span>
                            <input type="text" id="p6" placeholder="사회" value="사회" required class="w-full text-center py-2 px-2 border border-slate-300 rounded-md text-sm focus:ring-1 focus:ring-blue-500">
                        </div>
                        <div>
                            <span class="block text-xs text-slate-500 text-center mb-1 font-medium">7교시</span>
                            <input type="text" id="p7" placeholder="미술" value="미술" class="w-full text-center py-2 px-2 border border-slate-300 rounded-md text-sm focus:ring-1 focus:ring-blue-500">
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg hover:shadow-xl transition duration-200 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> 분석 및 할 일 플랜 생성하기
                </button>

            </form>
        </section>

        <!-- Result Container (Initially Hidden) -->
        <div id="resultContainer" class="hidden space-y-8">
            
            <!-- Analysis Dashboard Card -->
            <section class="bg-white rounded-2xl shadow-xl p-6 border border-slate-100">
                <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                    <i class="fa-solid fa-chart-pie text-indigo-500 mr-2"></i> 동선 분석 및 실천 게이지
                </h3>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-2">
                    <!-- Distance Card -->
                    <div id="distanceCard" class="bg-slate-50 rounded-xl p-4 border border-slate-200">
                        <!-- Dynamic Distance Content -->
                    </div>

                    <!-- Progress Gauge Card -->
                    <div class="bg-slate-50 rounded-xl p-4 border border-slate-200 md:col-span-2 flex flex-col justify-center">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-sm font-bold text-slate-700">실시간 상점 실천 게이지</span>
                            <span class="text-sm font-black text-blue-600" id="progressText">0 / 10 점 (0%)</span>
                        </div>
                        <!-- Gauge Bar Container -->
                        <div class="w-full bg-slate-200 rounded-full h-6 overflow-hidden p-1 shadow-inner relative">
                            <div id="progressBar" class="progress-bar-fill bg-gradient-to-r from-blue-500 via-indigo-500 to-emerald-500 h-4 rounded-full" style="width: 0%"></div>
                        </div>
                        <p class="text-xs text-slate-500 mt-2 text-right" id="gaugeGuideText">
                            <i class="fa-solid fa-square-check text-blue-500 mr-1"></i> 아래 할 일을 완료하고 체크하면 게이지가 올라갑니다!
                        </p>
                    </div>
                </div>
            </section>

            <!-- Customized Action Plan Checklist -->
            <section class="bg-white rounded-2xl shadow-xl p-6 border border-slate-100">
                <div class="flex items-center justify-between mb-6 pb-3 border-b border-slate-100">
                    <h3 class="text-xl font-bold text-slate-800 flex items-center">
                        <i class="fa-solid fa-list-check text-emerald-500 mr-2.5"></i>
                        오늘의 상점 추천 할 일 목록
                    </h3>
                    <span class="text-xs bg-emerald-100 text-emerald-800 font-bold px-2.5 py-1 rounded-full">체크시 게이지 상승</span>
                </div>

                <div id="timelineList" class="space-y-4">
                    <!-- Generated Checklist Items will be injected here -->
                </div>
            </section>

        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-6 text-center text-xs">
        <div class="max-w-4xl mx-auto px-4">
            <p>School Merit Helper • 상점 획득 달성 플래너</p>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        let currentProgress = 0;
        let targetMeritValue = 10;

        function generatePlan() {
            // Get Input Values
            targetMeritValue = parseInt(document.getElementById('targetMerit').value) || 10;
            const classFloor = parseInt(document.getElementById('classFloor').value);
            const officeFloor = parseInt(document.getElementById('officeFloor').value);

            const timetable = [];
            for (let i = 1; i <= 7; i++) {
                const val = document.getElementById(`p${i}`).value.trim();
                if (val) timetable.push({ period: i, subject: val });
            }

            // Calculate Floor Difference & Movement
            const floorDiff = Math.abs(classFloor - officeFloor);
            const walkTimeMinutes = (floorDiff * 1.5) + 1;
            const roundTripTime = Math.round(walkTimeMinutes * 2);

            // Render Distance Analysis
            const distanceCard = document.getElementById('distanceCard');
            let distanceBadge = '';
            let distanceDesc = '';

            if (floorDiff === 0) {
                distanceBadge = '<span class="bg-green-100 text-green-800 text-xs font-bold px-2 py-0.5 rounded ml-2">최단 동선</span>';
                distanceDesc = '같은 층에 있어 쉬는 시간 10분을 200% 활용할 수 있습니다!';
            } else if (floorDiff <= 2) {
                distanceBadge = '<span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-0.5 rounded ml-2">보통 거리</span>';
                distanceDesc = `왕복 약 ${roundTripTime}분 소요. 쉬는 시간에 교무실 다녀오기에 충분합니다.`;
            } else {
                distanceBadge = '<span class="bg-red-100 text-red-800 text-xs font-bold px-2 py-0.5 rounded ml-2">거리 멀음</span>';
                distanceDesc = `왕복 약 ${roundTripTime}분 소요. 쉬는 시간보다는 점심시간/방과 후 방문을 추천합니다.`;
            }

            distanceCard.innerHTML = `
                <div class="flex items-center justify-between mb-1">
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">교무실 동선</span>
                    ${distanceBadge}
                </div>
                <div class="text-lg font-black text-slate-800">
                    ${classFloor}층 ➔ ${officeFloor}층 (차이: ${floorDiff}층)
                </div>
                <p class="text-xs text-slate-600 mt-1">
                    <i class="fa-solid fa-person-walking text-blue-500 mr-1"></i> ${distanceDesc}
                </p>
            `;

            // Reset Progress
            currentProgress = 0;
            updateProgressBar();

            // Generate Tasks Array
            const timelineList = document.getElementById('timelineList');
            timelineList.innerHTML = '';

            const actions = [];

            // Morning Action
            actions.push({
                time: "아침 등교 / 조회 전",
                title: "교무실 자진 방문 & 아침 청소 봉사",
                pts: 2,
                desc: floorDiff > 2 
                    ? `[거리 멀음] 등교 직후 곧바로 ${officeFloor}층 교무실로 이동하여 담임선생님께 상점을 모으고 싶다고 솔직히 말씀드리고 청소 봉사를 신청하세요.`
                    : `교무실이 가까우므로 조회 전 일찍 등교하여 담임선생님 책상 정리, 칠판 준비, 교실 정돈 활동을 수행하세요.`,
                icon: "fa-sun text-amber-500"
            });

            // Class Period Actions
            timetable.forEach((item) => {
                const subj = item.subject;
                let strat = getSubjectStrategy(subj);
                actions.push({
                    time: `${item.period}교시 (${subj})`,
                    title: `수업 참여 및 정리 미션 (${subj})`,
                    pts: strat.pts,
                    desc: strat.desc,
                    icon: strat.icon
                });
            });

            // Lunch Action
            actions.push({
                time: "점심시간 (골든 타임)",
                title: "급식실 도우미 / 특별실 정리 봉사",
                pts: 3,
                desc: `식사 후 도서관 서가 정리, 보건실 기자재 정리, 잔반 줄이기 캠페인 도우미 활동에 참여하세요.`,
                icon: "fa-utensils text-emerald-500"
            });

            // After School Action
            actions.push({
                time: "방과 후",
                title: "교실 마감 정돈 & 최종 상점 추천 요청",
                pts: 2,
                desc: `남아서 창문 잠금, 전원 차단, 책상 정돈을 전담하고 담임선생님께 이동하여 오늘 실천한 행동에 대한 상점을 확정받으세요.`,
                icon: "fa-moon text-indigo-500"
            });

            // Render Actions Checklist
            actions.forEach((act) => {
                const itemEl = document.createElement('div');
                itemEl.className = "flex items-start space-x-3 p-4 rounded-xl border border-slate-200 hover:border-blue-300 transition bg-slate-50/50 hover:bg-white shadow-sm";
                itemEl.innerHTML = `
                    <div class="pt-1">
                        <input type="checkbox" onchange="toggleTask(this, ${act.pts})" class="w-5 h-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
                    </div>
                    <div class="flex-grow">
                        <div class="flex flex-wrap items-center justify-between gap-1 mb-1">
                            <span class="text-xs font-bold px-2 py-0.5 rounded bg-slate-200 text-slate-700">
                                <i class="fa-solid ${act.icon} mr-1"></i> ${act.time}
                            </span>
                            <span class="text-xs font-extrabold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full border border-blue-200">
                                +${act.pts}점 추천
                            </span>
                        </div>
                        <h4 class="font-bold text-slate-800 text-sm sm:text-base">${act.title}</h4>
                        <p class="text-xs sm:text-sm text-slate-600 mt-1 leading-relaxed">${act.desc}</p>
                    </div>
                `;
                timelineList.appendChild(itemEl);
            });

            // Show Container & Scroll
            const container = document.getElementById('resultContainer');
            container.classList.remove('hidden');
            container.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function getSubjectStrategy(subject) {
            const name = subject.toLowerCase();
            if (name.includes('체육')) {
                return {
                    pts: 2,
                    icon: "fa-volleyball text-orange-500",
                    desc: "수업 전후 체육 기구 자진 운반 및 정리, 준비운동 구령 대장 활동으로 선생님 추천 상점을 노리세요."
                };
            } else if (name.includes('과학') || name.includes('실험')) {
                return {
                    pts: 2,
                    icon: "fa-flask text-purple-500",
                    desc: "실험 종료 후 모둠별 실험 기구 세척 및 과학실 정리정돈을 전담하여 과학 교사 상점을 획득하세요."
                };
            } else if (name.includes('미술') || name.includes('음악') || name.includes('예술')) {
                return {
                    pts: 2,
                    icon: "fa-palette text-pink-500",
                    desc: "실습 재료 및 악기 운반을 돕고 수업 후 실습실 청소를 자진해서 도와 상점을 요청하세요."
                };
            } else if (name.includes('영어') || name.includes('수학') || name.includes('국어')) {
                return {
                    pts: 1,
                    icon: "fa-book-open text-blue-500",
                    desc: "수업 전 칠판 닦기, 수업 중 교사 질문에 큰 소리로 적극 대답하고 필기 완벽 제출하기를 실천하세요."
                };
            } else {
                return {
                    pts: 1,
                    icon: "fa-graduation-cap text-slate-600",
                    desc: "맨 앞자리에서 집중하는 태도를 보여주고, 모둠 활동 시 조장 역할을 맡아 교과 교사 추천 상점을 받으세요."
                };
            }
        }

        // 체크박스 클릭 시 실천 게이지 변경 함수
        function toggleTask(checkbox, pts) {
            const textContainer = checkbox.closest('div.flex-grow').querySelectorAll('h4, p');
            if (checkbox.checked) {
                currentProgress += pts;
                textContainer.forEach(el => el.classList.add('line-through', 'text-slate-400'));
            } else {
                currentProgress -= pts;
                textContainer.forEach(el => el.classList.remove('line-through', 'text-slate-400'));
            }
            updateProgressBar();
        }

        // 실천 게이지 및 텍스트 업데이트
        function updateProgressBar() {
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const gaugeGuideText = document.getElementById('gaugeGuideText');
            
            // 목표 점수 대비 진행률 (%) 계산 (최대 100%)
            const percentage = Math.min(Math.round((currentProgress / targetMeritValue) * 100), 100);
            
            // 게이지 바 길이 변경
            progressBar.style.width = `${percentage}%`;
            
            // 게이지 텍스트 및 달성 완료 메시지 변경
            if (percentage >= 100) {
                progressText.innerHTML = `${currentProgress} / ${targetMeritValue} 점 (100% 달성! <i class="fa-solid fa-trophy text-amber-500 animate-bounce"></i>)`;
                gaugeGuideText.innerHTML = `<span class="text-emerald-600 font-bold"><i class="fa-solid fa-circle-check mr-1"></i> 목표 상점을 모두 모았습니다! 선생님께 상점 추천을 요청하세요!</span>`;
            } else {
                progressText.innerText = `${currentProgress} / ${targetMeritValue} 점 (${percentage}%)`;
                gaugeGuideText.innerHTML = `<i class="fa-solid fa-square-check text-blue-500 mr-1"></i> 아래 할 일을 완료하고 체크하면 게이지가 올라갑니다!`;
            }
        }
    </script>
</body>
</html>
